monitoring.ui.container.elasticsearch.enabled: true
server:
  host: "0.0.0.0"
  shutdownTimeout: "5s"
  ssl:
    enabled: true
    certificate: /usr/share/kibana/config/certs/instance/${HOSTNAME}/${HOSTNAME}.crt
    key: /usr/share/kibana/config/certs/instance/${HOSTNAME}/${HOSTNAME}.key
elasticsearch:
  hosts: 
    - https://es-clusterip-service:9200
  ssl:
    certificateAuthorities: /usr/share/kibana/config/certs/ca/tls.crt
xpack:
  fleet:
    packages:
      - name: fleet_server
        version: latest
    agentPolicies:
      - name: Fleet Server Policy
        id: fleet-server-policy
        namespace: default
        package_policies:
          - name: fleet_server
            package:
              name: fleet_server
    outputs:
      - id: elasticsearch-output
        name: Preconfigured Elasticsearch Output
        type: elasticsearch
        hosts:
          - https://es-clusterip-service:9200
        is_default: true
        is_default_monitoring: true
        ssl:
          certificate_authorities:
            - |
