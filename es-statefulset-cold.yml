apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: es-statefulset-cold
  name: es-statefulset-cold
spec:
  replicas: 2
  selector:
    matchLabels:
      app: es-statefulset-cold
  serviceName: es-headless-service-cold-node-discovery
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: es-statefulset-cold
        part-of: es-statefulset
    spec:
      containers:
        - image: elasticsearch:9.3.2
          name: elasticsearch
          resources: 
            limits:
              memory: 2Gi
          volumeMounts:
            - name: es-config-volume
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: es-persistent-volume-claim
              mountPath: /usr/share/elasticsearch/data
            - name: es-ca-certs-volume
              mountPath: /usr/share/elasticsearch/config/certs/ca
            - name: es-node-certs-volume
              mountPath: /usr/share/elasticsearch/config/certs/node
          startupProbe:
            failureThreshold: 6
            periodSeconds: 10 
            tcpSocket:
              port: 9200
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /_cluster/health
              port: 9200
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
          env:
            - name: NODE_ROLE
              value: data_cold
      initContainers:
        - image: busybox:stable
          name: es-fix-data-dir-permissions
          command:
            - /bin/sh
          args:
            - '-c'	
            - 'chmod 757 /usr/share/elasticsearch/data && chown 1000:1000 /usr/share/elasticsearch/data'
          volumeMounts:
            - name: es-persistent-volume-claim
              mountPath: /usr/share/elasticsearch/data
          securityContext:
            privileged: true
        - image: elasticsearch:9.3.2
          name: es-create-pki-assets
          resources: 
            limits:
              memory: 2Gi
          command:
            - /bin/bash
          args:
            - '-c'
            - 'bin/elasticsearch-certutil cert --silent --pem --out config/certs/node/$HOSTNAME.zip --dns $HOSTNAME --name $HOSTNAME --ca-cert config/certs/ca/tls.crt --ca-key config/certs/ca/tls.key && unzip config/certs/node/$HOSTNAME.zip -d config/certs/node && rm config/certs/node/$HOSTNAME.zip'
          volumeMounts:
            - name: es-ca-certs-volume
              mountPath: /usr/share/elasticsearch/config/certs/ca
            - name: es-node-certs-volume
              mountPath: /usr/share/elasticsearch/config/certs/node
      volumes:
        - name: es-config-volume
          configMap:
            name: es-configmap
        - name: es-ca-certs-volume
          secret:
            secretName: ca-tls-secret
        - name: es-node-certs-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: es-persistent-volume-claim
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: es-persistent-volume
status: {}
